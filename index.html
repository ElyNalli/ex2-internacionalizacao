<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Início | Loja da Mica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body data-titulo="titulo_inicio">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-rosa">
        <div class="container">
          <a class="navbar-brand" href="index.html" data-i18n="marca"
            >Loja da Mica</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Abrir menu"
            data-i18n-aria="abrir_menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  href="index.html"
                  data-i18n="menu_inicio"
                  >Início</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="listagem.html"
                  data-i18n="menu_produtos"
                  >Produtos</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contato.html" data-i18n="menu_contato"
                  >Contato</a
                >
              </li>
              <li class="nav-item ms-lg-3 my-2 my-lg-0">
                <select
                  id="seletor-idioma"
                  class="form-select form-select-sm seletor-idioma"
                  aria-label="Idioma / Language"
                >
                  <option value="pt">Português</option>
                  <option value="en">English</option>
                </select>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero text-center text-white">
        <div class="container">
          <h1 data-i18n="hero_titulo">Bem-vindo à Loja da Mica</h1>
          <p class="lead" data-i18n="hero_texto">
            Produtos fofos da Sanrio, em qualquer tela.
          </p>
          <a
            href="listagem.html"
            class="btn btn-rosa btn-lg"
            data-i18n="hero_botao"
            >Ver produtos</a
          >
        </div>
      </section>

      <section class="container my-5">
        <h2 class="mb-4" data-i18n="destaques">Destaques</h2>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
          <div class="col">
            <div class="card h-100 text-center">
              <img
                src="img/hello-kitty.jpg"
                class="card-img-top"
                alt="Hello Kitty"
              />
              <div class="card-body">
                <h3 class="h5 card-title">Hello Kitty</h3>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="card h-100 text-center">
              <img
                src="img/my-melody.jpg"
                class="card-img-top"
                alt="My Melody"
              />
              <div class="card-body">
                <h3 class="h5 card-title">My Melody</h3>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="card h-100 text-center">
              <img
                src="img/cinnamoroll.jpg"
                class="card-img-top"
                alt="Cinnamoroll"
              />
              <div class="card-body">
                <h3 class="h5 card-title">Cinnamoroll</h3>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="text-white text-center py-3">
      <p class="mb-0" data-i18n="rodape">
        © 2026 Loja da Mica - Fatec Americana
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
  </body>
</html>
