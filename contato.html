<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contato | Loja da Mica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body data-titulo="titulo_contato">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-rosa">
        <div class="container">
          <a class="navbar-brand" href="index.html" data-i18n="marca"
            >Loja da Mica</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Abrir menu"
            data-i18n-aria="abrir_menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-item">
                <a class="nav-link" href="index.html" data-i18n="menu_inicio"
                  >Início</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="listagem.html"
                  data-i18n="menu_produtos"
                  >Produtos</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link active"
                  href="contato.html"
                  data-i18n="menu_contato"
                  >Contato</a
                >
              </li>
              <li class="nav-item ms-lg-3 my-2 my-lg-0">
                <select
                  id="seletor-idioma"
                  class="form-select form-select-sm seletor-idioma"
                  aria-label="Idioma / Language"
                >
                  <option value="pt">Português</option>
                  <option value="en">English</option>
                </select>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-5">
      <h1 class="mb-4" data-i18n="contato_titulo">Contato</h1>
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div
            id="msg-sucesso"
            class="alert alert-success d-none"
            role="alert"
          ></div>

          <form id="form-contato" novalidate>
            <div class="mb-3">
              <label for="nome" class="form-label" data-i18n="form_nome"
                >Nome</label
              >
              <input
                type="text"
                class="form-control form-control-lg"
                id="nome"
              />
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label" data-i18n="form_email"
                >E-mail</label
              >
              <input
                type="email"
                class="form-control form-control-lg"
                id="email"
              />
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label for="msg" class="form-label" data-i18n="form_msg"
                >Mensagem</label
              >
              <textarea
                class="form-control form-control-lg"
                id="msg"
                rows="4"
              ></textarea>
              <div class="invalid-feedback"></div>
            </div>
            <button
              type="submit"
              class="btn btn-rosa btn-lg w-100"
              data-i18n="form_enviar"
            >
              Enviar
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer class="text-white text-center py-3">
      <p class="mb-0" data-i18n="rodape">
        © 2026 Loja da Mica - Fatec Americana
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
  </body>
</html>
